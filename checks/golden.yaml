# Hand-copied headline numbers the pipeline must reproduce.
# Each entry traces to a public RELEASE PAGE (origin_url), never to the machine-readable feed itself.
# - tests/test_golden.py runs every entry against the checked-in fixtures (deterministic).
# - The live refresh checks only entries with check_live: true. Keep those on periods old enough
#   that routine revisions will not move them; a mismatch turns the source amber, not red.
# Spot-check log:
#   2026-09-07  all nine values matched the G.19 HTML tables parsed directly from the Fed's page
#               (checks/verify_g19.py), independent of FRED. June 2026 is marked preliminary ('p') on the page.
#   2026-09-07  tccp: the CFPB's February 2024 report count (15 issuers above 30% in H1 2023) reproduced exactly.
#               Its large-issuer tier medians for poor (28.49) and great (22.99) also reproduce when the H2 2023
#               top-25 list is applied to H1 2023, good differs by 0.04 and the small-issuer medians by up to
#               0.4 points, because the CFPB's own H1 2023 top-25 list is not in the public file. Not golden.
#   2026-09-07  phillyfed: eight numbers from the Q1 2026 Insights Report narrative reproduced from the 26Q1 CSVs
#               (balances, utilization ratio, 30+ DPD by balances, general-purpose APR, originations, 10th-percentile
#               origination score for Q1 2026 and Q4 2025, sub-660 share of new accounts). Also checked, not golden:
#               originations +8.7% y/y (105.53 / 97.12), purchase volume +6.4% y/y, commitments +4.2% y/y.
#   2026-09-07  nyfed_hhdc: the 2026-08-11 press release table reproduces from the 2026Q2 workbook: card balances $1.263tn,
#               flow into serious delinquency 6.97% (Q2 2026) and 6.93% (Q2 2025). Also checked, not golden: +$21bn on the
#               quarter, +$54bn on the year, +$85bn of card limits on the quarter (all exact from the loaded series).
#   2026-09-08  nyfed_sce: the survey page's headline sentence reproduces from the workbook: any-credit rejection 16.1% in
#               June 2026 (16.126) and 23.1% in June 2025 (23.126).
#   2026-09-08  fdic: QBP Second Quarter 2026, Table II-A 'Credit cards' reproduces from the API industry sum for all three
#               columns (2Q 2026 1,189,601, 1Q 2026 1,161,264, 2Q 2025 1,141,110, millions) and the institution count
#               (4,238). Also checked, not golden: Table V-A 'Credit card loans' 30-89 days 1.37% and noncurrent 1.44%
#               reproduce as P3CRCD / LNCRCD (1.370) and NCCRCD / LNCRCD (1.441) at 2026-06-30.
#   2026-09-10  dfa: the Z.1 release PDF of 2026-06-11, table S14.b (Balance sheet of households), reproduces from the
#               sum of the five wealth groups to the tenth of a billion: consumer credit 4,988.2 (2023), 4,948.1 (2024),
#               5,099.4 (2025); deposits 14,131.9 (2025, lines 6 plus 7); net worth 174,003.5 (2025). The 2026 Q1 sum
#               (5,073.0) is 0.9bn above the September G.19's NSA total for March 2026 (vintage), so G.19 is not a golden.
#   2026-09-11  nyfed_hhdc: the 2026-08-11 press release's transition-into-serious-delinquency table reproduces for
#               every loan type read from the workbook: auto 3.00, mortgage 1.52, credit card 6.97 and student 7.83
#               percent at 2026 Q2. Also checked, not golden: 90+ share of balances 12.92 (card), 5.49 (auto), 0.99
#               (mortgage), 10.60 (student), 3.31 (all debt).
#   2026-09-10  cfpb_cct: NO golden. No release page states the Consumer Credit Trends numbers; the biennial Consumer
#               Credit Card Market Report counts from issuer data (89 million new accounts in 2024 against 83 million in
#               the panel files). The fetcher checks the score and age files sum to within 6 percent of the total file
#               instead, and the fixture test pins the January 2026 dashboard readings (8.2 million cards, $54.2bn).

