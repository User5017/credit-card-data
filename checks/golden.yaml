  metric: tccp_issuers_max_apr_over_30_count
  entity: TCCP_ALL
  tier: all
  period_type: H
  period_end: 2023-06-30
  source: tccp
  expected: 15
  tolerance: 0
  check_live: true
  origin: "CFPB report 'Credit card data: Small issuers offer lower rates' (2024-02-16), on the January-June 2023 survey: 'A total of 15 issuers, including nine of the largest credit card issuers in the country, reported at least one product with a maximum purchase APR over 30%'"
  origin_url: https://www.consumerfinance.gov/data-research/research-reports/credit-card-data-small-issuers-offer-lower-rates/
