# Hand-copied headline numbers the pipeline must reproduce.
# Each entry traces to a public RELEASE PAGE (origin_url), never to the machine-readable feed itself.
# - tests/test_golden.py runs every entry against the checked-in fixtures (deterministic).
# - The live refresh checks only entries with check_live: true. Keep those on periods old enough
#   that routine revisions will not move them; a mismatch turns the source amber, not red.
# Spot-check log:
#   2026-09-07  all nine values matched the G.19 HTML tables parsed directly from the Fed's page
#               (checks/verify_g19.py), independent of FRED. June 2026 is marked preliminary ('p') on the page.
#   2026-09-07  tccp: the CFPB's February 2024 report count (15 issuers above 30% in H1 2023) reproduced exactly.
#               Its large-issuer tier medians for poor (28.49) and great (22.99) also reproduce when the H2 2023
#               top-25 list is applied to H1 2023, good differs by 0.04 and the small-issuer medians by up to
#               0.4 points, because the CFPB's own H1 2023 top-25 list is not in the public file. Not golden.
#   2026-09-07  phillyfed: eight numbers from the Q1 2026 Insights Report narrative reproduced from the 26Q1 CSVs
#               (balances, utilization ratio, 30+ DPD by balances, general-purpose APR, originations, 10th-percentile
#               origination score for Q1 2026 and Q4 2025, sub-660 share of new accounts). Also checked, not golden:
#               originations +8.7% y/y (105.53 / 97.12), purchase volume +6.4% y/y, commitments +4.2% y/y.
#   2026-09-07  nyfed_hhdc: the 2026-08-11 press release table reproduces from the 2026Q2 workbook: card balances $1.263tn,
#               flow into serious delinquency 6.97% (Q2 2026) and 6.93% (Q2 2025). Also checked, not golden: +$21bn on the
#               quarter, +$54bn on the year, +$85bn of card limits on the quarter (all exact from the loaded series).

