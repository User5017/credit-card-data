# NY Fed HHDC: the quarterly press release carries a table of levels and delinquency flows for the newest quarter and the
# same quarter a year earlier. Balances are printed in trillions to three decimals (so a billion), flows to two decimals.
# The workbook revises prior quarters: between the 2026Q1 and 2026Q2 files the 2026Q1 card balance moved by $10bn (twenty
# times the tolerance) while the flows did not move, and nothing moved between the 2025Q2 and 2026Q2 files. So the balance
# entry is fixture-only, like the recent G.19 months; the two flow entries are checked live, the year-old one is the
# one expected to hold.
- id: hhdc_card_balances_2026_q2
  metric: hhdc_card_balances
  entity: CCP_ALL
  tier: all
  period_type: Q
  period_end: 2026-06-30
  source: nyfed_hhdc
  expected: 1263
  tolerance: 0.5
  check_live: false
  origin: "NY Fed press release of 2026-08-11 ('Household Debt Balances Decreased Slightly; Credit Card Delinquency Transition Rates Remained Steady'), table 'Household Debt and Credit Developments as of Q2 2026', Credit Card Debt, 'Total As of Q2 2026 (Trillions $)': $1.263"
  origin_url: https://www.newyorkfed.org/newsevents/news/research/2026/20260811

