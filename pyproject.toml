[project]
name = "carddash"
version = "0.1.0"
description = "Self-updating dashboard of US credit card data from public sources"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.scripts]
carddash = "carddash.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carddash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
