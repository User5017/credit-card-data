name: refresh

on:
  schedule:
    # 22:00 UTC = 18:00 ET in summer, 17:00 ET in winter. After the day's Fed/BEA/Census releases.
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "**.md"   # task-board and design notes alone do not need a refresh run

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest

      - name: Refresh data and render
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # The SEC requires a declaring contact address and refuses this pipeline's normal User-Agent because it
          # contains a URL, so issuer_8k sends 'carddash/<version> <contact>'. Without this the source fails loudly.
          CARDDASH_CONTACT: ${{ secrets.CARDDASH_CONTACT }}
        run: uv run carddash refresh

      - name: Commit data and site
        if: always()
        run: |
          git config user.name "carddash-bot"
          git config user.email "carddash-bot@users.noreply.github.com"
          git add data docs checks/restatement_ack.yaml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          # A person pushing while the nightly is mid-flight used to fail the whole job on a non-fast-forward
          # and throw the refresh commit away. That happened on 2026-09-12 and cost a day of the
          # two-consecutive-green-scheduled-runs check, because a failed run is not a green one. The
          # concurrency group does not help: it stops a second run starting, not someone pushing to main.
          # So rebase onto whatever landed and try again. On a conflict the freshly rendered files win
          # (-X theirs favours the commit being replayed, which is this one), because they are generated
          # output and the next run regenerates all of it anyway.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; exit 1; }
          done
          echo "could not push the refresh commit after three attempts"
          exit 1

      - name: Fail the job if any source is red
        run: uv run carddash health --fail-on-red
